[gateway]
gateway_server ansible_host=YOUR_GATEWAY_IP ansible_user=root

[application]
app_server ansible_host=YOUR_APP_SERVER_IP ansible_user=root

[database]
db_server ansible_host=YOUR_DB_SERVER_IP ansible_user=root

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'